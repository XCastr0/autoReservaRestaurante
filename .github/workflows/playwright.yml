name: Playwright Tests

on:
  workflow_dispatch:
  push:
    branches: [ "main", "principal", "master", "develop", "desenvolver" ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout automação
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps (automação)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Checkout app repo (front + back)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.APP_REPO }}
          path: app

      - name: Debug - confirmar pastas do repo app
        run: |
          echo "APP_REPO=${{ vars.APP_REPO }}"
          echo "BACKEND_DIR=${{ vars.BACKEND_DIR }}"
          echo "FRONTEND_DIR=${{ vars.FRONTEND_DIR }}"
          ls -la app
          ls -la "app/${{ vars.BACKEND_DIR }}" || true
          ls -la "app/${{ vars.FRONTEND_DIR }}" || true

      - name: Start backend
        working-directory: app/${{ vars.BACKEND_DIR }}
        run: |
          npm ci
          npm run dev &

      - name: Start frontend
        working-directory: app/${{ vars.FRONTEND_DIR }}
        run: |
          npm ci
          npm run dev &

      - name: Wait services
        run: npx wait-on http://localhost:3030 http://localhost:3000

      - name: Run Playwright tests
        env:
          BASE_URL_API: http://localhost:3030
          BASE_URL_WEB: http://localhost:3000
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
