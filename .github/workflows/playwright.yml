name: Playwright Tests (API + E2E)

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (automation repo)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install automation deps
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Clona BACKEND
      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BACKEND_REPO }}
          path: backend
          token: ${{ secrets.REPO_TOKEN }}

      # Clona FRONTEND
      - name: Checkout frontend repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.FRONTEND_REPO }}
          path: frontend
          token: ${{ secrets.REPO_TOKEN }}

      # Sobe tudo com Docker Compose (Postgres + API + WEB)
      - name: Start app stack
        run: docker compose -f docker-compose.ci.yml up -d --build

      - name: Wait for API
        run: |
          for i in {1..60}; do
            if curl -sSf "${BASE_URL_API}/health" > /dev/null; then
              echo "API is up!"
              exit 0
            fi
            echo "Waiting API..."
            sleep 2
          done
          echo "API did not start in time"
          docker compose -f docker-compose.ci.yml logs
          exit 1
        env:
          BASE_URL_API: http://localhost:3030

      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASE_URL_API: http://localhost:3030
          BASE_URL_WEB: http://localhost:3000

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload Test Results (attachments)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 14

      - name: Shutdown stack
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
