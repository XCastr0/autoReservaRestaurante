services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: restaurante
    ports:
      - "5432:5432"

  backend:
    build: ./app/backend
    environment:
      DATABASE_URL: postgresql://postgres:1234@db:5432/restaurante?schema=public
      PORT: 3030
    depends_on:
      - db
    ports:
      - "3030:3030"
    command: sh -c "npm ci && npx prisma migrate deploy && npm run dev"

  frontend:
    build: ./app/front-end
    environment:
      PORT: 3000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3000"
